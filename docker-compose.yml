services:
  grimoire:
    build: .
    # tini as PID 1 reaps orphaned grandchildren of check/action scripts
    init: true
    ports:
      - "8000:8000"
    environment:
      # config.yaml and (optionally) mise.toml live in ./config
      GRIMOIRE_CONFIG: /app/config/config.yaml
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - grimoire-tools:/app/tools
      - grimoire-workspace:/app/workspace
      - ./state:/app/state

volumes:
  grimoire-workspace:
  grimoire-tools:
