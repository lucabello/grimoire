{# Run-button partial for an action — swaps between idle and running states.
   Only polls when running (every 2s). Idle state is static. #}
{% if running %}
<div id="action-run-btn-{{ slug }}"
     hx-get="{{ base_path }}/partials/action-run-status/{{ slug }}?was_running=1"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
    <button class="btn btn-primary btn-sm gap-1" disabled>
        <span class="loading loading-spinner loading-xs"></span>
        Running…
        {% if progress_total > 0 %}
        <span class="font-mono-nums text-xs opacity-80">{{ progress_completed }}/{{ progress_total }}</span>
        {% endif %}
    </button>
</div>
{% else %}
<div id="action-run-btn-{{ slug }}">
    <button class="btn btn-primary btn-sm gap-1"
            hx-post="{{ base_path }}/partials/action-run/{{ slug }}"
            hx-target="#action-run-btn-{{ slug }}"
            hx-swap="outerHTML"
            hx-on::after-request="if(!event.detail.successful) { showToast(event.detail.xhr?.status === 409 ? 'Action is already running' : 'Failed to trigger action', 'error'); }">
        <i class="fa-solid fa-play text-xs"></i>
        <span class="btn-label">Run</span>
        <span class="htmx-indicator loading loading-spinner loading-xs"></span>
    </button>
</div>
{% endif %}
