# Grimoire Configuration
# ======================
# Copy this file to config.yaml and adjust values.
# String values support environment variable references: "${ENV_VAR}"

# GitHub authentication
github:
  token: "${GITHUB_TOKEN}"   # or a literal: "ghp_your_token_here"

# Git user for commits/PRs made by actions (optional — omit if not using actions)
# git:
#   user:
#     name: "Your Name"
#     email: "you@example.com"
#   signing:                  # optional
#     key_path: "/keys/id_ed25519"
#     format: "ssh"           # "ssh" or "gpg"
#   ssh_known_hosts: "/keys/known_hosts"

# Teams: every tracked repo belongs to a team, so declaring at least one is mandatory.
#   id          (required) letters, digits, '-' and '_'; used in ?team= filters
#   label       (optional) display name in the dashboard, defaults to id
#   github      (optional) "org/team-slug": track all non-archived repos of that GitHub team
#   exclude     (optional) full repo names to skip from the GitHub team listing
#   workflows   (optional) include/exclude workflow name globs for GitHub team repos
#   repositories (optional) explicit repos for this team; combine with github if needed
# Each team needs `github` or at least one entry in `repositories`.
# A repo listed in several teams is merged by name.
teams:
  - id: "backend"
    label: "Backend"
    github: "org-name/backend-team"
    exclude:
      - "org-name/excluded-repo"

  - id: "frontend"
    repositories:
      # Individual repo with specific branches
      - repo: "owner/repo-name"
        branches: ["main", "develop"]

      # Individual repo (default branch only)
      - repo: "owner/another-repo"

# Staleness thresholds
staleness:
  pull_requests_days: 30   # PRs with no push/comment for this many days
  issues_days: 365         # Issues with no comment for this many days

  # Percentage thresholds for highlighting stale counts as problematic (yellow).
  # When stale/open >= this percentage, the count is highlighted.
  # Set to 0 to always highlight, or 100 to never highlight.
  problematic_stale_issues_pct: 20
  problematic_stale_prs_pct: 20

# Data refresh schedule (cron expression; also default check frequency)
refresh_schedule: "*/5 * * * *"

# Backlog (prioritised problem list)
# backlog:
#   category_weights:          # base importance of each problem type
#     failing_workflow: 100
#     failing_check_error: 80
#     failing_check_warning: 30
#     stale_pr: 50
#     stale_issue: 20
#   workflow_weights:           # per-workflow-name multiplier (glob patterns)
#     "Release *": 2.0
#     "Lint": 0.5
#   repository_weights:        # per-repo weight multiplier (last match wins)
#     - regex: "*"             # catch-all baseline
#       weight: 1.0
#     - regex: "*-operator"    # fnmatch glob on full_name
#       weight: 3.0
#     - repos:                 # explicit list
#         - "org/critical-repo"
#       weight: 5.0

# PRs page: named groups of the open PRs of the tracked repositories, with their CI
# status. Values of one list are alternatives; different fields must all match.
# prs:
#   groups:
#     - name: "Maintenance"
#       authors: ["app/renovate", "app/dependabot"]   # also matches renovate[bot]
#       labels: ["dependencies"]    # alternatives
#       title_words: ["deps"]       # case-insensitive words in the title (not a regex)
#       draft: false
#       base: main
#       repos: ["owner/*"]          # optional fnmatch scope; default: all tracked repos

# Paths
data_dir: "./data"           # Contains checks/ and actions/ subdirectories
workspace_dir: "./workspace" # Where repos are cloned
database_path: "./grimoire.db"
log_file: "./grimoire.log"
